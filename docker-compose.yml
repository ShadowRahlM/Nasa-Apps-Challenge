services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrismart
      POSTGRES_USER: agrismart
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - agrismart-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrismart -d agrismart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agrismart-postgres:
